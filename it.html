
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Node.js Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #475569;
            line-height: 1.6;
        }

        .status {
            color: #16a34a;
            font-weight: bold;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to My Application!</h1>

        <p>This is my first HTML homepage hosted using Node.js and Express.</p>

        <p class="status">● Application is running successfully</p>

        <button onclick="alert('Hello! Welcome to my application.')">
            Click Me
        </button>

        <p><small>Deployed with Node.js, Express and Render.</small></p>
    </div>

</body>
</html>
